name: Publish NPM packages
on:
    push:
        tags:
            - v*
    workflow_dispatch:
permissions:
    contents: read
    id-token: write

jobs:
    npm:
        if: github.repository == 'Vendicated/Vencord'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: 24
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Run Tests
              run: vp run test

            - name: Build Vencord Types
              run: vp run generateTypes

            - name: Publish NPM Packages
              run: vp pm stage publish --provenance --filter "./packages/{discord,vencord}-types"
