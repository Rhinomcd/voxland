name: Test Patches
on:
    workflow_dispatch:
        inputs:
            discord_branch:
                type: choice
                description: "Discord Branch to test patches on"
                options:
                    - both
                    - stable
                    - canary
                default: both
            webhook_url:
                type: string
                description: "Webhook URL that the report will be posted to. This will be visible for everyone, so DO NOT pass sensitive webhooks like discord webhook. This is meant to be used by Venbot."
                required: false
            repository:
                type: string
                description: Repository to test patches on
                required: false
            ref:
                type: string
                description: "Git reference to test patches on. This can be a branch, tag, or commit SHA."
                required: false
permissions:
    contents: read

jobs:
    TestStablePlugins:
        if: github.repository == 'Vendicated/Vencord' && (inputs.discord_branch == 'both' || inputs.discord_branch == 'stable')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout user repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  repository: ${{ inputs.repository || github.repository }}

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: 24
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Build Vencord Reporter Version
              run: vp run buildReporter

            - name: Run Stable Reporter
              timeout-minutes: 10
              run: |
                  export PATH="$PWD/node_modules/.bin:$PATH"
                  export CHROMIUM_BIN=/usr/bin/google-chrome

                  esbuild scripts/generateReport.ts > dist/report.mjs

                  node dist/report.mjs >> "$GITHUB_STEP_SUMMARY"
              env:
                  WEBHOOK_URL: ${{ inputs.webhook_url || secrets.DISCORD_WEBHOOK }}
                  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

    TestCanaryPlugins:
        if: github.repository == 'Vendicated/Vencord' && (inputs.discord_branch == 'both' || inputs.discord_branch == 'canary')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout user repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  repository: ${{ inputs.repository || github.repository }}

            - name: Setup Vite+
              uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: 24
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Build Vencord Reporter Version
              run: vp run buildReporter

            - name: Run Canary Reporter
              timeout-minutes: 10
              run: |
                  export PATH="$PWD/node_modules/.bin:$PATH"
                  export CHROMIUM_BIN=/usr/bin/google-chrome

                  esbuild scripts/generateReport.ts > dist/report.mjs
                  USE_CANARY=true node dist/report.mjs >> "$GITHUB_STEP_SUMMARY"
              env:
                  WEBHOOK_URL: ${{ inputs.webhook_url || secrets.DISCORD_WEBHOOK }}
                  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
