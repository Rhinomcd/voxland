name: Bug or crash report
description: Report a bug or crash in Voxland.
labels: [bug]
title: "[Bug] <title>"

body:
    - type: markdown
      attributes:
          value: |
              Issues are for bugs. Ask questions in [Q&A](https://github.com/Rhinomcd/voxland/discussions/categories/q-a) and propose ideas in [Ideas](https://github.com/Rhinomcd/voxland/discussions/categories/ideas).

              Report Voxland bugs here, never to Vencord or Vesktop. Redact other people's names, avatars, and messages from screenshots and logs.

    - type: textarea
      id: bug-description
      attributes:
          label: What happens?
          description: Where and when the bug or crash happens.
      validations:
          required: true

    - type: textarea
      id: expected-behaviour
      attributes:
          label: What should happen instead?
      validations:
          required: true

    - type: textarea
      id: steps-to-take
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Enable ...
              2. Open ...
              3. See ...
      validations:
          required: true

    - type: input
      id: environment
      attributes:
          label: Environment
          description: Voxland version or commit, Discord branch (Stable, PTB, Canary), and how you run it (voxland-desktop, browser extension, or injected into the Discord app).
          placeholder: voxland-desktop 1.0.0 on Arch Linux, Discord Stable
      validations:
          required: true

    - type: textarea
      id: crash-log
      attributes:
          label: Errors
          description: Open the developer console with `Ctrl+Shift+I` and paste any red errors, ignoring network errors.
          render: text
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Checklist
          options:
              - label: I searched existing issues and this hasn't been reported.
                required: true
              - label: If an agent wrote this report, I read it and it says so with the model name.
                required: true
